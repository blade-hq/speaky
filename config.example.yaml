# 通常在应用内设置。手动配置时，将此文件复制为 config.yaml。
# Windows: %APPDATA%\speaky\gpui\config.yaml
# macOS: ~/Library/Application Support/speaky/config.yaml
core:
  asr:
    language: auto

desktop:
  preload_local_model: false

engine:
  # local | openai | remote（应用探测并保存） | volc_bigmodel
  current: local
  # 填写所选离线包 manifest.json 的 id。
  local_pack: example-asr-pack

  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o-transcribe
    api_key: ""
    use_vocabulary_prompt: false

  volc_bigmodel:
    api_key: ""
