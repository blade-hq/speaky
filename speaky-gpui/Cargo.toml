[package]
name = "speaky-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
byteorder = "1"
cpal = "0.16"
dirs = "5"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["multipart", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
embed_plist = "1.2"
objc = "0.2"
raw-window-handle = "0.6"
