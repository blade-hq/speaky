name: Speaky CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-check:
    name: Core Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio & TLS dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libssl-dev
      - run: cargo test -p speaky-core --locked
      - run: cargo test -p speaky-core --no-default-features --locked
