name: Speaky Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v*)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        name: Package macOS
        run: |
          cargo build --release --locked -p speaky-gpui
          ditto -c -k --norsrc target/release/speaky-gpui Speaky-macOS.zip
      - if: runner.os == 'Windows'
        name: Package Windows x64
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK fxc.exe is required for the release build.' }
          $env:GPUI_FXC_PATH = $fxc.FullName
          cargo build --release --locked -p speaky-gpui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-windows.ps1 -Executable target/release/speaky-gpui.exe -Output Speaky-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Speaky-${{ runner.os }}
          path: Speaky-*.zip
          if-no-files-found: error

  win7:
    name: Win7 (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build and validate Windows 7 executable
        shell: pwsh
        run: ./scripts/build-win7.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Speaky-Windows7-x64
          path: Speaky-Windows7-x64.zip
          if-no-files-found: error

  publish:
    needs: [build, win7]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Speaky-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            Speaky-macOS.zip
            Speaky-Windows-x64.zip
            Speaky-Windows7-x64.zip
          fail_on_unmatched_files: true
