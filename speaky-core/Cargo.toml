[package]
name = "speaky-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
local-packs = ["windows-sys/Win32_System_JobObjects", "windows-sys/Win32_System_Diagnostics_ToolHelp"]

[dependencies]
byteorder = "1"
cpal = "0.16"
dirs = "5"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["multipart", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
unicode-segmentation = "1.12"
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_UI_Controls",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
