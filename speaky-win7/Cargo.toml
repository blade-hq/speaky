[package]
name = "speaky-win7"
version = "0.1.0"
edition = "2021"

[target.'cfg(windows)'.dependencies]
speaky-core = { path = "../speaky-core", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
